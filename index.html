<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanika's Stopwatch</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
}

.container{
width:400px;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
text-align:center;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
color:white;
}

h1{
margin-bottom:20px;
}

.time{
font-size:3rem;
font-weight:bold;
margin:20px 0;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:600;
transition:0.3s;
}

.start{background:#22c55e;color:white;}
.pause{background:#f59e0b;color:white;}
.reset{background:#ef4444;color:white;}
.lap{background:#3b82f6;color:white;}

button:hover{
transform:translateY(-3px);
}

ul{
margin-top:20px;
max-height:150px;
overflow-y:auto;
list-style:none;
text-align:left;
}

ul li{
padding:8px;
margin:5px 0;
background:rgba(255,255,255,0.1);
border-radius:8px;
}

.footer{
margin-top:20px;
font-size:14px;
opacity:0.8;
}
</style>
</head>

<body>

<div class="container">
<h1>⏱ Stopwatch</h1>

<div class="time" id="display">00:00:00</div>

<div class="buttons">
<button class="start" onclick="start()">Start</button>
<button class="pause" onclick="pause()">Pause</button>
<button class="reset" onclick="resetWatch()">Reset</button>
<button class="lap" onclick="lap()">Lap</button>
</div>

<ul id="laps"></ul>

<div class="footer">
Developed by <b>Kanika Chaudhary</b>
</div>
</div>

<script>
let seconds = 0;
let minutes = 0;
let hours = 0;
let timer = null;

function updateDisplay(){
let h = String(hours).padStart(2,'0');
let m = String(minutes).padStart(2,'0');
let s = String(seconds).padStart(2,'0');

document.getElementById("display").innerText =
`${h}:${m}:${s}`;
}

function run(){
seconds++;

if(seconds==60){
seconds=0;
minutes++;
}

if(minutes==60){
minutes=0;
hours++;
}

updateDisplay();
}

function start(){
if(timer!==null) return;
timer=setInterval(run,1000);
}

function pause(){
clearInterval(timer);
timer=null;
}

function resetWatch(){
clearInterval(timer);
timer=null;
seconds=0;
minutes=0;
hours=0;
updateDisplay();
document.getElementById("laps").innerHTML="";
}

function lap(){
let lapTime=document.getElementById("display").innerText;
let li=document.createElement("li");
li.innerText="Lap: "+lapTime;
document.getElementById("laps").appendChild(li);
}
</script>

</body>
</html>
